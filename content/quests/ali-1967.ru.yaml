title: Призыв
prompt: "Хьюстон, апрель 1967 года. Вы — чемпион мира в тяжёлом весе, и вас призывают на войну во Вьетнаме. Откажетесь — потеряете титул и, возможно, попадёте в тюрьму. Шагнуть вперёд или отказаться?"
choices:
  - Шагнуть вперёд
  - Отказаться
reveal: "Мухаммед Али отказался. Его лишили титула, и три с половиной года — на пике карьеры — он не выходил на ринг. В 1971 году Верховный суд отменил его приговор."
