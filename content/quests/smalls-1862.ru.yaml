title: "«Плантер»"
prompt: "Гавань Чарлстона, перед рассветом 13 мая 1862 года. Вы — лоцман-раб на пароходе конфедератов, и белые офицеры ушли ночевать на берег. Ваша семья и семьи других членов команды прячутся неподалёку. Гавань стерегут форты с пушками. Остаться или увести корабль?"
choices:
  - Остаться и ждать конца войны
  - Провести корабль мимо фортов к флоту Союза
reveal: "Роберт Смоллс увёл корабль. В соломенной капитанской шляпе, подавая нужные сигналы свистком, он провёл пароход мимо фортов и сдал «Плантер» блокадной эскадре Союза — на борту было шестнадцать человек. Позже он пять сроков заседал в Конгрессе США."
