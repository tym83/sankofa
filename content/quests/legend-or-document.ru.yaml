title: Документ или легенда?
prompt: "Что из этого засвидетельствовал человек, который сам бежал из рабства?"
choices:
  - Лоскутные одеяла, вывешенные на заборах, были зашифрованными картами побега
  - "Спиричуэл «О Ханаан, милый Ханаан» (O Canaan, sweet Canaan) означал: добраться до Севера"
  - "Песня «Иди за Ковшом» (Follow the Drinking Gourd) была спетой картой Подземной железной дороги"
reveal: "Фредерик Дуглас писал, что для него и его друзей «О Ханаан, милый Ханаан» означало Север. Коды на одеялах пришли из книги 1999 года, у которой нет документальных источников, а «Иди за Ковшом» впервые опубликовали в 1928 году; историки сомневаются, что это была карта побега."
