metadata: {name: legend-or-document}
spec:
  type: quiz
  title: Document or legend?
  prompt: "Which of these is documented by a person who escaped slavery himself?"
  choices:
    - Quilts hung on fences carried coded escape maps
    - The spiritual "O Canaan, sweet Canaan" meant reaching the North
    - '"Follow the Drinking Gourd" was a sung map of the Underground Railroad'
  answer: 1
  reveal: "Frederick Douglass wrote that for him and his friends 'O Canaan, sweet Canaan' meant the North. The quilt codes come from a 1999 book without documentary sources, and 'Follow the Drinking Gourd' was first published in 1928; historians doubt it was an escape map."
