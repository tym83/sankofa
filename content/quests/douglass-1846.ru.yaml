title: Выкуп
prompt: "1846 год. Вы бежали из рабства и опубликовали свою историю под настоящими именами, так что бывший хозяин знает, кто вы и где вас искать. Друзья в Британии предлагают выкупить вас у него. Но некоторые аболиционисты говорят: заплатить — значит признать, что человек может быть собственностью. Вы согласитесь?"
choices:
  - Согласиться на выкуп
  - Отказаться и жить дальше беглецом
reveal: "Фредерик Дуглас согласился. Британские сторонники заплатили около 150 фунтов, и в декабре 1846 года он стал свободным по закону. Кое-кто из аболиционистов осудил выкуп. Дуглас же видел в нём цену за возможность вернуться домой и продолжать борьбу."
