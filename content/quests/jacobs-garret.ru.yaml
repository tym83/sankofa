title: Бежать или остаться рядом с детьми
prompt: "Северная Каролина, 1835 год. Вам нужно спастись от мужчины, который не оставит вас в покое, но двое ваших маленьких детей остаются в городе. Бежать на Север без них или спрятаться рядом, не зная, надолго ли?"
choices:
  - Бежать на Север сейчас
  - Спрятаться неподалёку, рядом с детьми
reveal: "Гарриет Джейкобс спряталась. Почти семь лет она прожила в тесном закутке под крышей бабушкиного дома, где нельзя было встать в полный рост, и смотрела на своих детей сквозь маленькое отверстие, просверленное своими руками. В 1842 году она бежала на Север, а в 1861-м сама издала рассказ об этих годах."
