title: Сорок фунтов
prompt: "1760-е годы. Ваш хозяин, торговец-квакер, обещал, что вы сможете выкупить себе свободу за сорок фунтов — столько он сам за вас заплатил. Вы понемногу приторговываете, по нескольку стаканов да фруктов за раз, и в любом порту можете потерять всё. Копить дальше, веря обещанию, или бежать в следующем порту?"
choices:
  - Копить дальше и держать его на слове
  - Бежать при первой возможности
reveal: "Олауда Эквиано копил. В июле 1766 года он заплатил Роберту Кингу сорок фунтов и получил вольную. Двадцать три года спустя он издал автобиографию, стал одним из самых известных аболиционистов Британии, и его читают до сих пор."
