title: Открытый гроб
prompt: "Чикаго, сентябрь 1955 года. Вашего четырнадцатилетнего сына убили в Миссисипи, и его тело вернулось домой изуродованным. Похороны через несколько дней. Закрыть гроб или оставить открытым?"
choices:
  - Закрытый гроб, как все и ждут
  - Открытый — чтобы все увидели
reveal: "Мейми Тилл-Мобли выбрала открытый гроб: она хотела, чтобы мир увидел, что сделали с её сыном. Пришли десятки тысяч людей, а журнал Jet опубликовал фотографии. Многие потом говорили, что именно тогда присоединились к движению за гражданские права."
