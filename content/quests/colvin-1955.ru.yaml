title: Лицо бойкота
prompt: "Монтгомери, март 1955 года. Пятнадцатилетняя школьница Клодетт Колвин только что отказалась уступить место в автобусе, и полицейские силой выволокли её наружу. Вы — один из организаторов движения. Сделать её лицом борьбы против сегрегации в автобусах или дождаться другого случая?"
choices:
  - Строить кампанию вокруг неё, не откладывая
  - Дождаться другого случая
reveal: "Местные лидеры решили ждать. Через девять месяцев арестовали Розу Паркс, и начался бойкот. Но Колвин в конце концов не забыли: она стала одной из истиц по делу «Браудер против Гейл», которое в 1956 году положило конец сегрегации в автобусах Монтгомери."
