title: Чья соната?
prompt: "Скрипичную сонату № 9 Бетховена называют «Крейцеровой». Для кого он на самом деле её написал?"
choices:
  - Родольф Крейцер
  - Джордж Бриджтауэр
  - Жозеф Болонь, шевалье де Сен-Жорж
reveal: "Он написал её для Джорджа Бриджтауэра и впервые сыграл вместе с ним в Вене в 1803 году. После ссоры посвящение досталось Крейцеру, который так её и не исполнил."
