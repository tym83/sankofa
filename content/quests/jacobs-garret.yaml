metadata: {name: jacobs-garret}
spec:
  type: dilemma
  title: Run, or stay near the children
  prompt: "North Carolina, 1835. You must escape a man who will not leave you alone, but your two small children stay behind in town. Do you run North without them, or hide close by, not knowing for how long?"
  choices:
    - Run North now
    - Hide nearby, close to the children
  reveal: "Harriet Jacobs hid. For almost seven years she lived in a crawl space under her grandmother's roof, too low to stand, watching her children through a small hole she bored. In 1842 she escaped North, In 1861 she published the story of those years herself."
  cards: [jacobs-garret]
