title: Третий на пьедестале
prompt: "Мехико, октябрь 1968 года. Двое американских спринтеров поднимут на пьедестале кулаки в чёрных перчатках. Вы — серебряный призёр, белый австралиец. Они спрашивают, с ними ли вы. Что вы сделаете?"
choices:
  - Сохранить нейтралитет
  - Надеть значок Олимпийского проекта за права человека
reveal: "Питер Норман надел значок. Томми Смита и Джона Карлоса выгнали с Игр. Нормана на родине годами сторонились. Когда в 2006 году он умер, Смит и Карлос несли его гроб."
