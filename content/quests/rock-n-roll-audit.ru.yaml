title: Необъявленные зависимости
prompt: "Установите рок-н-ролл и проведите аудит. На чьём труде он держится, ни словом об этом не упоминая?"
reveal: "Розетта Тарп играла госпел на электрогитаре в 1930-е и 1940-е годы и повлияла на Чака Берри, Литл Ричарда и Элвиса. Биг Мама Торнтон записала «Hound Dog» за три года до Элвиса."
