- {card: omar-ibn-said, file: omar-ibn-said.jpg, verdict: fix, note: "LoC: 'most of the materials in this collection are in the public domain'; 1831 manuscript, author d. 1863, PD by age. Caption claimed 'page 3' and verses 'set down from memory', which the record does not state; record says the text opens with Surat al-Mulk (fol. 1a-3a). Caption rewritten."}
