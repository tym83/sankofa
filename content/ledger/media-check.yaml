# Independent second check of every image in media.yaml (2026-11-12).
# Each source page was reopened (Commons file page/API, LoC ?fo=json) and the
# local file viewed. verdict: ok | fix (corrected in the card) | reject (media
# entry removed from the card; file left in content/media/).
- {card: adlam, file: adlam.jpg, verdict: ok, note: "Commons self, CC BY-SA 4.0 (Smoking Tyre, 2025-09-17). Crop shows only the Adlam lettering; typeface lettering carries no separate copyright. Caption and credit match."}
