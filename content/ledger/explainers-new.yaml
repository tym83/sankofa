  - claim: "The N'Ko literacy movement spread across West Africa without government support"
    sources:
      - {title: "Dianne White Oyler, History in Africa 24 (1997), abstract (grassroots movement spread from the Gambia to Nigeria without government intervention or support)", url: "https://www.cambridge.org/core/journals/history-in-africa/article/nko-alphabet-as-a-vehicle-of-indigenist-historiography1/D095250EBB95F2CF3F237D12A7AB6710"}
