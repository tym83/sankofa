      - {title: "Hood Museum: Ukara brochure (2015) (gestural signs)", url: "https://hoodmuseum.dartmouth.edu/sites/hoodmuseum.prod/files/hoodmuseum/publications/ukara-brochure-2015.pdf"}
  - claim: "On ukara the signs stand out white on indigo"
    sources:
      - {title: "Hood Museum: Ukara brochure (2015) ('white against a deep blue background')", url: "https://hoodmuseum.dartmouth.edu/sites/hoodmuseum.prod/files/hoodmuseum/publications/ukara-brochure-2015.pdf"}
