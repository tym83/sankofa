    sources:
      - {title: "The Unicode Standard 17.0, chapter 19: N'Ko (right to left; one symbol, one sound; seven vowels, 19 consonants)", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"}
