  - claim: "Kanté wrote on many subjects, from history to medicine, copying many books by hand"
    sources:
      - {title: "Coleman Donaldson, African Studies Review (over one hundred books on linguistics, history, traditional medicine and Islam)", url: "https://www.cambridge.org/core/journals/african-studies-review/article/role-of-islam-ajami-writings-and-educational-reform-in-sulemaana-kantes-nko/E6394B2D11A96EE6872CA621456E2D22"}
