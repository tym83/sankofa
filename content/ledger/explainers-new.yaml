# Explainer rewrite (2026-11-12): the NEW claims each of the 25 explainer cards
# adds, with the sources that state them. Existing facts are not repeated here;
# they stay in final.yaml. For an independent re-check.
spirituals:
  - claim: "Spirituals are religious folk songs made by enslaved African Americans, most likely from the late eighteenth century on (also years: [1780, 1878])"
    sources:
      - {title: "Angela M. S. Nelson, What Did Slave Songs Sound Like?, Christian History 31 (1991): 'many scholars believe ... the spiritual originated in the late eighteenth century'", url: "https://christianhistoryinstitute.org/magazine/article/golden-age-of-hymns-spirituals"}
      - {title: "Carnegie Hall Timeline (Maultsby): Folk spiritual, emerging with Second Awakening camp meetings (1780s-1830s), created by enslaved and freed Blacks", url: "https://timeline.carnegiehall.org/genres/folk-spiritual"}
      - {title: "Digital History, University of Houston: Spirituals (late 18th/early 19th c. conversion; spirituals created by enslaved African Americans)", url: "https://www.digitalhistory.uh.edu/active_learning/explorations/spirituals/spirituals_menu.cfm"}
  - claim: "They were made from Bible stories, hymns and African ways of singing"
    sources:
      - {title: "Nelson, Christian History 31: 'fashioned by combining verses from the Bible and hymns'; drew on African singing styles", url: "https://christianhistoryinstitute.org/magazine/article/golden-age-of-hymns-spirituals"}
      - {title: "Carnegie Hall Timeline: Folk spiritual ('African call-response and repetitive chorus structures')", url: "https://timeline.carnegiehall.org/genres/folk-spiritual"}
  - claim: "No two singers sang quite the same thing; a leader started each verse, often improvising, and the others 'based' him with the refrain"
    sources:
      - {title: "Allen, Ware and Garrison, Slave Songs of the United States (1867), introduction p. v (primary)", url: "https://docsouth.unc.edu/church/allen/allen.html"}
      - {title: "Carnegie Hall Timeline: Folk spiritual (call-and-response between soloist and singers; improvised; slight deviations from the melody line)", url: "https://timeline.carnegiehall.org/genres/folk-spiritual"}
  - claim: "Singers clapped, or shuffled round in a ring in the worship called the shout"
    sources:
      - {title: "Slave Songs of the United States (1867), introduction pp. xiii-xiv, quoting The Nation, 30 May 1867 (primary)", url: "https://docsouth.unc.edu/church/allen/allen.html"}
      - {title: "Yolanda Y. Smith, He Still Wid Us, Jesus, Christian History 62 (ring shout; basers clapping)", url: "https://christianhistoryinstitute.org/magazine/article/he-still-wid-us-jesus"}
      - {title: "Carnegie Hall Timeline: Folk spiritual (handclapping, foot-stomping, 'the shout')", url: "https://timeline.carnegiehall.org/genres/folk-spiritual"}
  - claim: "They sang of Israel led out of Egypt into Canaan; words could carry a double meaning"
    sources:
      - {title: "Yolanda Y. Smith, Christian History 62 (God's deliverance of Israel from Egypt as inspiration)", url: "https://christianhistoryinstitute.org/magazine/article/he-still-wid-us-jesus"}
      - {title: "Carnegie Hall Timeline: Folk spiritual (biblical themes, deliverance; double entendre)", url: "https://timeline.carnegiehall.org/genres/folk-spiritual"}
      - {title: "Digital History, University of Houston: Spirituals (Old and New Testament stories; hidden transcripts)", url: "https://www.digitalhistory.uh.edu/active_learning/explorations/spirituals/spirituals_menu.cfm"}
  - claim: "Frederick Douglass, singing of Canaan while planning an escape, wrote that 'the north was our Canaan'"
    sources:
      - {title: "Frederick Douglass, My Bondage and My Freedom (1855), ch. XIX, p. 278-279 (primary)", url: "https://docsouth.unc.edu/neh/douglass55/douglass55.html"}
      - {title: "Yolanda Y. Smith, Christian History 62 (quotes the passage)", url: "https://christianhistoryinstitute.org/magazine/article/he-still-wid-us-jesus"}
  - claim: "At first the Fisk singers hardly sang spirituals; Ella Sheppard: 'We did not dream of ever using them in public ... They were associated with slavery and the dark past' (also wow)"
    sources:
      - {title: "Andrew Ward, They Brought the Jubilee, American Heritage 51:4 (2000)", url: "https://www.americanheritage.com/they-brought-jubilee"}
      - {title: "PBS American Experience: Jubilee Singers (film page, quotes Sheppard)", url: "https://www.pbs.org/wgbh/americanexperience/films/singers/"}
      - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard"}
  - claim: "Audiences asked for them; Sheppard arranged them, in four-part harmony"
    sources:
      - {title: "PBS American Experience: Jubilee Singers (arranging fell to Sheppard; more spirituals as audiences received them)", url: "https://www.pbs.org/wgbh/americanexperience/films/singers/"}
      - {title: "Carnegie Hall Timeline: Concert spiritual (Fisk first popularised choral arrangement; four-part harmony)", url: "https://timeline.carnegiehall.org/genres/concert-spiritual"}
  - claim: "Spirituals reached the concert hall with Harry T. Burleigh (link to existing card burleigh-dvorak)"
    sources:
      - {title: "Carnegie Hall Timeline: Spiritual as Art Song (already on burleigh-dvorak)", url: "https://timeline.carnegiehall.org/genres/spiritual-as-art-song"}
      - {title: "Skidmore Saratoga Memory Project: Burleigh timeline (already on burleigh-dvorak)", url: "https://ssmp.skidmore.edu/exhibits/show/burleigh_in_saratoga/burleigh_bio/timeline"}
  - claim: "Place: St. Helena Island, South Carolina Sea Islands, where spirituals and the shout were sung and Slave Songs of the United States (1867), the first book of spirituals, was largely collected"
    sources:
      - {title: "Slave Songs of the United States (1867), introduction pp. i-ii (Port Royal islands, church on St. Helena)", url: "https://docsouth.unc.edu/church/allen/allen.html"}
      - {title: "Associated Press (Luis Andres Henao, 2025) via WCIV", url: "https://abcnews4.com/news/local/gullah-geechee-elders-work-to-preserve-sacred-songs-passed-down-by-enslaved-ancestors-wciv-abc-news-4-charleston-sc-south-carolina-st-helena-island-sea-islands"}
work-songs:
  - claim: "Enslaved African Americans sang work songs to fit particular jobs, drawing on West and Central African singing"
    sources:
      - {title: "Maryland Public Television / Thinkport: Work songs (task-specific songs; West and Central African practices)", url: "https://thinkport.org/mptclassroom/waters-edge/music-making/work-songs.html"}
      - {title: "Carnegie Hall Timeline (Maultsby): Work songs and field calls (enslaved retained customs of the past)", url: "https://timeline.carnegiehall.org/genres/work-songs-field-street-calls-satirical-protest-songs"}
  - claim: "They were sung while rowing boats, felling trees and working the fields, setting the pace of shared labour"
    sources:
      - {title: "Carnegie Hall Timeline: Work songs (cotton and tobacco fields, clearing brush, rowing; coordinate movement)", url: "https://timeline.carnegiehall.org/genres/work-songs-field-street-calls-satirical-protest-songs"}
      - {title: "Thinkport: Work songs (rowing boats, axe-cutting songs)", url: "https://thinkport.org/mptclassroom/waters-edge/music-making/work-songs.html"}
      - {title: "Association for Cultural Equity: Prison Songs (field hollers, wood-cutting songs)", url: "https://www.culturalequity.org/rounder-records/prison"}
  - claim: "Outsiders often read the singing as contentment; Douglass: 'Slaves sing most when they are most unhappy'; he 'often sung to drown my sorrow'"
    sources:
      - {title: "Frederick Douglass, Narrative (1845), ch. II, Documenting the American South (primary)", url: "https://docsouth.unc.edu/neh/douglass/douglass.html"}
      - {title: "Frederick Douglass, Narrative (1845), Project Gutenberg edition", url: "https://www.gutenberg.org/ebooks/23"}
  - claim: "The Sierra Leone rowers: one sang a couplet, all joined in the chorus (detail of an existing fact)"
    sources:
      - {title: "Thomas Winterbottom, An Account of the Native Africans ... Sierra Leone (1803), vol. 1 (primary, already in card)", url: "https://archive.org/stream/accountofnativea01wint/accountofnativea01wint_djvu.txt"}
      - {title: "Carnegie Hall Timeline: Work songs (quotes the physician)", url: "https://timeline.carnegiehall.org/genres/work-songs-field-street-calls-satirical-protest-songs"}
  - claim: "Places reordered: Sierra Leone coast (earliest documented leader-chorus work singing) first, Parchman second"
    sources:
      - {title: "Winterbottom (1803)", url: "https://archive.org/details/accountofnativea01wint"}
      - {title: "Carnegie Hall Timeline: Work songs", url: "https://timeline.carnegiehall.org/genres/work-songs-field-street-calls-satirical-protest-songs"}
blues:
  - claim: "The blues grew up among African Americans in the Mississippi Delta at the end of the nineteenth century"
    sources:
      - {title: "Jeff Todd Titon, The Blues, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/blues"}
      - {title: "Carnegie Hall Timeline (Maultsby): Rural/Folk Blues (Deep South, 1890s; believed to start on Mississippi Delta plantations)", url: "https://timeline.carnegiehall.org/genres/rural-folk-blues"}
  - claim: "Three-line verse: the second line repeats the first, the third answers with a rhyme, over twelve bars and three chords"
    sources:
      - {title: "Titon, Encyclopedia of African-American Culture and History (AAB, twelve bars)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/blues"}
      - {title: "Carnegie Hall Timeline: Rural/Folk Blues (three-line stanza; 12-bar form on three chords)", url: "https://timeline.carnegiehall.org/genres/rural-folk-blues"}
      - {title: "Ballad of America: Blues (line repeated, rhyming third line)", url: "https://balladofamerica.org/blues/"}
  - claim: "Blue notes are the flattened third and seventh"
    sources:
      - {title: "Carnegie Hall Timeline: Rural/Folk Blues", url: "https://timeline.carnegiehall.org/genres/rural-folk-blues"}
      - {title: "Ballad of America: Blues", url: "https://balladofamerica.org/blues/"}
  - claim: "The guitar answers each sung line (call and response between voice and instrument)"
    sources:
      - {title: "Carnegie Hall Timeline: Rural/Folk Blues (call-and-response; lead instrument echoes the melody)", url: "https://timeline.carnegiehall.org/genres/rural-folk-blues"}
      - {title: "Ballad of America: Blues ('call and response often occurs between a singer and a musical instrument')", url: "https://balladofamerica.org/blues/"}
  - claim: "Lyrics are about mistreatment by lovers, hard times, travel and prison"
    sources:
      - {title: "Titon, Encyclopedia of African-American Culture and History (mistreatment by lovers, misfortune)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/blues"}
      - {title: "Carnegie Hall Timeline: Rural/Folk Blues (relationships, hardship, traveling, imprisonment)", url: "https://timeline.carnegiehall.org/genres/rural-folk-blues"}
gospel:
  - claim: "Gospel is church music made in Black Chicago in the 1930s, new songs with sacred words set to blues melodies, harmonies and beat"
    sources:
      - {title: "Carnegie Hall Timeline (Maultsby): Traditional gospel (Chicago churches, 1930s; Dorsey fused blues-styled melodies and harmonies, blues and ragtime rhythms)", url: "https://timeline.carnegiehall.org/genres/traditional-gospel"}
      - {title: "New Georgia Encyclopedia: Georgia Tom Dorsey (fused sacred music with his blues technique)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/"}
      - {title: "Christianity Today (2018): Dorsey's 'gospel blues'", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/"}
  - claim: "Unlike spirituals, gospel songs had composers and were sold as sheet music; Dorsey published his songs himself"
    sources:
      - {title: "New Georgia Encyclopedia: Dorsey's decision to publish his own music", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/"}
      - {title: "Christianity Today (2018): sold more than 4,000 copies at the 1930 convention", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/"}
  - claim: "Choirs and soloists sang them"
    sources:
      - {title: "Carnegie Hall Timeline: Traditional gospel (groups, quartets, choirs)", url: "https://timeline.carnegiehall.org/genres/traditional-gospel"}
      - {title: "New Georgia Encyclopedia: Dorsey directing gospel choruses at Pilgrim and Ebenezer Baptist", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/"}
  - claim: "First to the piano and later the Hammond organ"
    sources:
      - {title: "Carnegie Hall Timeline: Traditional gospel (piano, Hammond B3 organ, drums as core instruments)", url: "https://timeline.carnegiehall.org/genres/traditional-gospel"}
      - {title: "NPR (Anne Ford, 2016) via WUNC: Hammond organ and gospel, Chicago 1939 onward", url: "https://www.wunc.org/2016-01-03/how-the-hammond-organ-sound-laid-the-tracks-for-gospels-hit-train"}
  - claim: "A strong, rocking beat"
    sources:
      - {title: "Carnegie Hall Timeline: Traditional gospel ('rockin' style of religious music')", url: "https://timeline.carnegiehall.org/genres/traditional-gospel"}
      - {title: "Christianity Today (2018): 'His songs had a beat, rhythm, and tempo'", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/"}
  - claim: "Many ministers at first rejected the songs because the beat sounded secular, like the blues clubs"
    sources:
      - {title: "Carnegie Hall Timeline: Traditional gospel ('most ministers of independent Black churches initially rejected his songs'; 'secular' beat)", url: "https://timeline.carnegiehall.org/genres/traditional-gospel"}
      - {title: "Christianity Today (2018): pastors scoffed at a honky-tonk blues player composing church music", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/"}
  - claim: "Dorsey published his songs himself (story detail)"
    sources:
      - {title: "New Georgia Encyclopedia", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/"}
      - {title: "Christianity Today (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/"}
jazz:
  - claim: "Jazz emerged in New Orleans around 1900, mainly in the Black community, among Black and Creole musicians"
    sources:
      - {title: "NPS New Orleans Jazz NHP: Jazz Origins in New Orleans (roots mainly in the Black community; Creole of color musicians)", url: "https://www.nps.gov/jazz/learn/historyculture/history_early.htm"}
      - {title: "Carnegie Hall Timeline: New Orleans-style jazz (careers around the turn of the 20th century; uptown Black streets)", url: "https://timeline.carnegiehall.org/genres/new-orleans-style-jazz"}
  - claim: "It drew on ragtime, the blues, spirituals and brass-band marches"
    sources:
      - {title: "NPS: A New Orleans Jazz History ('ragtime, blues, spirituals, marches')", url: "https://www.nps.gov/jazz/learn/historyculture/jazz_history.htm"}
      - {title: "Carnegie Hall Timeline: New Orleans-style jazz (ragtime, blues, syncopated brass-band marches, religious music)", url: "https://timeline.carnegiehall.org/genres/new-orleans-style-jazz"}
  - claim: "Played with a ragged, swinging rhythm"
    sources:
      - {title: "Carnegie Hall Timeline: New Orleans-style jazz ('ragged approach to the rhythmic interpretation')", url: "https://timeline.carnegiehall.org/genres/new-orleans-style-jazz"}
      - {title: "NPS: A New Orleans Jazz History (looser feel of swing)", url: "https://www.nps.gov/jazz/learn/historyculture/jazz_history.htm"}
  - claim: "Typical band: front line of cornet, clarinet and trombone over a rhythm section"
    sources:
      - {title: "NPS: A New Orleans Jazz History", url: "https://www.nps.gov/jazz/learn/historyculture/jazz_history.htm"}
      - {title: "Carnegie Hall Timeline: New Orleans-style jazz (cornet, clarinet, trombone, tuba, banjo, drums)", url: "https://timeline.carnegiehall.org/genres/new-orleans-style-jazz"}
  - claim: "Many players did not read music and worked numbers out by ear"
    sources:
      - {title: "NPS: A New Orleans Jazz History (away from sight-reading toward playing by ear)", url: "https://www.nps.gov/jazz/learn/historyculture/jazz_history.htm"}
      - {title: "Carnegie Hall Timeline: New Orleans-style jazz (musicians who could not read music)", url: "https://timeline.carnegiehall.org/genres/new-orleans-style-jazz"}
  - claim: "They improvised together (collective improvisation)"
    sources:
      - {title: "NPS: A New Orleans Jazz History ('collective improvisation')", url: "https://www.nps.gov/jazz/learn/historyculture/jazz_history.htm"}
      - {title: "Carnegie Hall Timeline: New Orleans-style jazz ('a collective improvisational instrumental art form')", url: "https://timeline.carnegiehall.org/genres/new-orleans-style-jazz"}
  - claim: "Bands played for dances, picnics, parades and brass-band funerals"
    sources:
      - {title: "NPS: Jazz Origins in New Orleans (parades, dances, picnics)", url: "https://www.nps.gov/jazz/learn/historyculture/history_early.htm"}
      - {title: "Carnegie Hall Timeline: New Orleans-style jazz (funeral bands, dancers, parades)", url: "https://timeline.carnegiehall.org/genres/new-orleans-style-jazz"}

rhythm-and-blues:
  - claim: "Rhythm and blues was Black dance music of the 1940s and early 1950s, made in big cities after the Second World War"
    sources:
      - {title: "Carnegie Hall Timeline (Maultsby): Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues"}
      - {title: "Encyclopedia of African-American Culture and History: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues"}
  - claim: "Swing orchestras shrank to small jump bands; jump blues kept the twelve-bar blues, a boogie-woogie bass, a shuffle beat and a featured saxophone"
    sources:
      - {title: "Carnegie Hall Timeline (Maultsby): Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues"}
      - {title: "Encyclopedia of African-American Culture and History: Rhythm and Blues (jump bands, honking tenor saxophonists, shuffle and boogie-woogie)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues"}
  - claim: "The drums hit hard on the backbeat, beats two and four"
    sources:
      - {title: "Carnegie Hall Timeline (Maultsby): Rhythm & Blues ('heavy backbeats on 2 and 4')", url: "https://timeline.carnegiehall.org/genres/rhythm-blues"}
      - {title: "PBS Sound Field: How James Brown invented funk ('most music of that era gave heavy emphasis to the back beat, on the two and the four')", url: "https://www.pbs.org/video/how-james-brown-invented-funk-xtwzri/"}
  - claim: "Saxophonist and singer Louis Jordan and his Tympany Five set the model"
    sources:
      - {title: "Carnegie Hall Timeline (Maultsby): Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues"}
      - {title: "Encyclopedia of African-American Culture and History: Rhythm and Blues ('greatest of the jump band leaders was saxophonist and vocalist Louis Jordan')", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues"}
  - claim: "Vocal groups brought close harmony from the gospel church"
    sources:
      - {title: "Encyclopedia of African-American Culture and History: Rhythm and Blues (vocal groups drew heavily from gospel)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues"}
      - {title: "Carnegie Hall Timeline: Rock 'n' Roll (doo-wop groups rooted in gospel)", url: "https://timeline.carnegiehall.org/genres/rock-n-roll"}
  - claim: "It played in Black clubs from New York to Los Angeles (places: New York City, Los Angeles)"
    sources:
      - {title: "Encyclopedia of African-American Culture and History: Rhythm and Blues (New York among R&B cities)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues"}
      - {title: "Carnegie Hall Timeline (Maultsby): Rhythm & Blues (Johnny Otis, Club Alabam, Los Angeles; Zanzibar, NY)", url: "https://timeline.carnegiehall.org/genres/rhythm-blues"}
      - {title: "GRAMMY.com: R&B pioneer Johnny Otis dies (1948 Barrelhouse, one of Los Angeles' first R&B clubs)", url: "https://www.grammy.com/news/rb-pioneer-johnny-otis-dies/"}
  - claim: "By the mid-1960s the music took a new name, soul"
    sources:
      - {title: "Carnegie Hall Timeline (Maultsby): Rhythm & Blues ('In the mid-1960s, the combo style transformed into a new sound labeled soul')", url: "https://timeline.carnegiehall.org/genres/rhythm-blues"}
      - {title: "Encyclopedia of African-American Culture and History: Rhythm and Blues ('By 1964 black popular music had acquired a new name: soul music')", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues"}
rock-n-roll:
  - claim: "Rock and roll was rhythm and blues under a new name, promoted to Black and white teenagers; young white listeners took up R&B records by Black musicians in the early 1950s"
    sources:
      - {title: "Carnegie Hall Timeline: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll"}
      - {title: "Encyclopedia of Cleveland History: Freed, Alan (appeal of black music to young white consumers)", url: "https://case.edu/ech/articles/f/freed-alan"}
  - claim: "The phrase rock and roll was old blues slang for sex"
    sources:
      - {title: "Encyclopedia of Cleveland History: Freed, Alan ('believed to be an old blues reference to sex')", url: "https://case.edu/ech/articles/f/freed-alan"}
      - {title: "Encyclopedia of African-American Culture and History: Rhythm and Blues ('originally a euphemism for sex')", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues"}
  - claim: "Fats Domino: \"What they call rock 'n' roll is rhythm and blues\""
    sources:
      - {title: "Carnegie Hall Timeline: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll"}
      - {title: "64 Parishes: Fats Domino (quote, 1956)", url: "https://64parishes.org/entry/fats-domino"}
  - claim: "It ran on an aggressive beat and loud electric guitar, with saxophone solos and pounding piano"
    sources:
      - {title: "Carnegie Hall Timeline: Rock 'n' Roll ('an aggressive beat and prominent electric guitars', sax solos, pumping pianos)", url: "https://timeline.carnegiehall.org/genres/rock-n-roll"}
      - {title: "Library of Congress: Steve Propes on Rocket 88 (piano, loud electric guitar, tenor saxes, drums)", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf"}
  - claim: "Rocket 88 was played on Turner's piano, two tenor saxophones, drums and a guitar whose buzz, the story goes, came from an amplifier that fell off the car on the way"
    sources:
      - {title: "Library of Congress: Steve Propes on Rocket 88 ('legend has it that his amplifier fell off the roof of the band's car')", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf"}
      - {title: "Blues Foundation Hall of Fame: Rocket 88 (personnel; amp fell off the station wagon)", url: "https://www.blues.org/award-search/rocket-88-is-one-of-many-blues-a"}
funk:
  - claim: "Funk is dance music built on a repetitive syncopated groove set by bass and drums, with guitar, horns and keyboards played as rhythm instruments"
    sources:
      - {title: "Carnegie Hall Timeline: Funk", url: "https://timeline.carnegiehall.org/genres/funk"}
      - {title: "Kembrew McLeod, Funk, St. James Encyclopedia of Popular Culture", url: "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-theory-forms-and-instruments/funk"}
  - claim: "Where earlier music leaned on the backbeat (two and four), James Brown put the emphasis on the first beat, 'the one'"
    sources:
      - {title: "PBS Sound Field: How James Brown invented funk", url: "https://www.pbs.org/video/how-james-brown-invented-funk-xtwzri/"}
      - {title: "Encyclopedia.com: Funk (Oxford Pocket Dictionary entry: 'typically accentuates the first beat in the bar')", url: "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-theory-forms-and-instruments/funk"}
  - claim: "Credit for funk's birth goes above all to James Brown and his band; 'Papa's Got a Brand New Bag' (1965) is counted among the first funk records"
    sources:
      - {title: "Kembrew McLeod, Funk, St. James Encyclopedia of Popular Culture", url: "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-theory-forms-and-instruments/funk"}
      - {title: "Carnegie Hall Timeline: Funk ('James Brown gave funk its polyrhythmic foundation')", url: "https://timeline.carnegiehall.org/genres/funk"}
  - claim: "Sly Stone blurred funk with rock and soul"
    sources:
      - {title: "Kembrew McLeod, Funk, St. James Encyclopedia of Popular Culture", url: "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-theory-forms-and-instruments/funk"}
      - {title: "Carnegie Hall Timeline: Funk (Sly Stone introduced rock technology)", url: "https://timeline.carnegiehall.org/genres/funk"}
  - claim: "'Funky Drummer' was recorded in 1969 at the King studios in Cincinnati (place: King Records studios, Evanston, Cincinnati)"
    sources:
