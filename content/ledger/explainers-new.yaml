    sources:
      - {title: "The Unicode Standard 17.0/18.0, chapter 19: Bamum (syllabary developed 1896-1910; 80 syllable characters)", url: "https://www.unicode.org/versions/Unicode18.0.0/core-spec/chapter-19/"}
