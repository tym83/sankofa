      - {title: "Michael Everson, Proposal for encoding Adlam (2014), §1 (father wrote Fulani in Arabic script: 'That's not our script')", url: "https://www.unicode.org/L2/L2014/14219-n4628-adlam.pdf"}
  - claim: "Adlam is taught in schools in several African countries"
    sources:
      - {title: "The Unicode Standard 17.0, chapter 19: Adlam (taught at schools in Guinea, Nigeria ...)", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"}
