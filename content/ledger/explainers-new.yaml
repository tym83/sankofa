  - claim: "Place: N'Ko first appeared in Bingerville, Côte d'Ivoire (first place kept); Kanté was from Kankan"
    sources:
      - {title: "Dianne White Oyler, History in Africa 24 (1997), abstract (Kanté of Kankan; first appearance in Bingerville, 14 April 1949)", url: "https://www.cambridge.org/core/journals/history-in-africa/article/nko-alphabet-as-a-vehicle-of-indigenist-historiography1/D095250EBB95F2CF3F237D12A7AB6710"}
      - {title: "Coleman Donaldson, African Studies Review (Kantè devised N'ko in Côte d'Ivoire)", url: "https://www.cambridge.org/core/journals/african-studies-review/article/role-of-islam-ajami-writings-and-educational-reform-in-sulemaana-kantes-nko/E6394B2D11A96EE6872CA621456E2D22"}
nsibidi:
  - claim: "Nsibidi signs do not spell sounds but stand for ideas and situations"
    sources:
      - {title: "Princeton University Art Museum: Victor Ekpuk, Language and Lineage ('an ancient nonspoken system of communication')", url: "https://artmuseum.princeton.edu/art/stories-perspectives/conversation-victor-ekpuk-language-and-lineage"}
