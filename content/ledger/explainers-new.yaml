      - {title: "Frontiers in Communication: dùndún and bàtá (oríkì and proverbs; civic and religious rituals)", url: "https://www.frontiersin.org/journals/communication/articles/10.3389/fcomm.2021.652542/full"}
      - {title: "Bascom, Folkways liner notes (greetings, praise names; drummers of the King of Oyo in the palace)", url: "https://folkways-media.si.edu/docs/folkways/artwork/FW04441.pdf"}

adlam:
  - claim: "Fulani is spoken by some 40 million people across the Sahel, from Senegal and Guinea to Nigeria, Chad and Cameroon"
    sources:
      - {title: "Michael Everson, Proposal for encoding Adlam (2014), §1 (more than 40 million; Senegal ... Nigeria, Chad, Cameroon, Niger)", url: "https://www.unicode.org/L2/L2014/14219-n4628-adlam.pdf"}
