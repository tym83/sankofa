      - {title: "Red Bull Music Academy Daily: The birth of Notting Hill Carnival", url: "https://daily.redbullmusicacademy.com/2013/08/birth-of-notting-hill-carnival"}
talking-drums:
  - claim: "The dùndún is played with a curved stick"
    sources:
      - {title: "Smithsonian Folkways: William Bascom, Drums of the Yoruba of Nigeria (stick curving through ninety degrees)", url: "https://folkways-media.si.edu/docs/folkways/artwork/FW04441.pdf"}
      - {title: "Samuel Kayode Akinbo, The Language of Gángan, Frontiers in Communication (2021)", url: "https://www.frontiersin.org/journals/communication/articles/10.3389/fcomm.2021.650382/full"}
  - claim: "The ensemble is led by the ìyáàlù, the 'mother drum', which carries most of the text"
    sources:
      - {title: "Frontiers in Communication: Speech surrogacy systems of the Yoruba dùndún and bàtá (2021)", url: "https://www.frontiersin.org/journals/communication/articles/10.3389/fcomm.2021.652542/full"}
      - {title: "Akinbo, The Language of Gángan", url: "https://www.frontiersin.org/journals/communication/articles/10.3389/fcomm.2021.650382/full"}
      - {title: "Bascom, Folkways liner notes (iya ilu, mother of the drums)", url: "https://folkways-media.si.edu/docs/folkways/artwork/FW04441.pdf"}
  - claim: "Talking drums are not a code like telegraphy; they reproduce the tones of the language"
    sources:
