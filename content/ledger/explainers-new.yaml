      - {title: "Anagnost, British Art Studies 28 (mourning garment by elites, then popularized across ranks)", url: "https://britishartstudies.ac.uk/issues/28/adinkra-from-kumase-to-the-british-museum/"}
      - {title: "GWU Textile Museum collection stories (worn by royalty and spiritual leaders for funerals)", url: "https://collectionstories.museum.gwu.edu/?p=445"}
      - {title: "Carol Ventura (originally only mourning cloth; today other special occasions)", url: "https://www.carolventura.com/Adinkra.htm"}
      - {title: "Doran H. Ross (Sunday adinkra as festive dress)", url: "https://www.encyclopedia.com/fashion/encyclopedias-almanacs-transcripts-and-maps/adinkra"}
  - claim: "Places: African Burial Ground removed (disputed object site, not where adinkra arose or spread); Kumasi and Ntonso kept as the places of origin and continued production"
    sources:
      - {title: "Anagnost, British Art Studies 28 (Kumase)", url: "https://britishartstudies.ac.uk/issues/28/adinkra-from-kumase-to-the-british-museum/"}
      - {title: "Carol Ventura: Adinkra in Ntonso-Ashanti", url: "https://www.carolventura.com/Adinkra.htm"}
banjo:
  - claim: "The banjo body, once a gourd, later a wooden hoop/frame, is covered with skin like a drum"
    sources:
      - {title: "Ballad of America: Banjo, A Brief History (gourd body covered like a drum with hide; Boucher's wood-frame body)", url: "https://balladofamerica.org/banjo/"}
      - {title: "Encyclopedia Virginia: Joel Walker Sweeney (wooden body replacing the gourd)", url: "https://encyclopediavirginia.org/entries/joel-walker-sweeney-ca-1810-october-1860/"}
  - claim: "The strings run over a bridge that rests on the skin head"
    sources:
      - {title: "NPR: The Banjo's Roots Reconsidered (movable bridge holds strings over the skin head, as in banjos)", url: "https://www.npr.org/transcripts/139880625"}
      - {title: "UCLA Ethnomusicology Review: Historical Narratives of the Akonting and Banjo (bridge atop the animal-skin soundplane)", url: "https://ethnomusicologyreview.ucla.edu/node/763"}
  - claim: "Beside the long strings runs a short thumb or drone string"
    sources:
      - {title: "Ballad of America (short fifth string providing a drone)", url: "https://balladofamerica.org/banjo/"}
      - {title: "e-WV: Banjo (fifth or drone string)", url: "https://wvencyclopedia.org/entries/314"}
      - {title: "Encyclopedia Virginia: Sweeney (earlier banjos already had a short drone string)", url: "https://encyclopediavirginia.org/entries/joel-walker-sweeney-ca-1810-october-1860/"}
  - claim: "The oldest playing style is the downstroke or clawhammer: a finger strikes down, the thumb sounds the drone on the way back"
    sources:
      - {title: "e-WV: Banjo (clawhammer or stroke style learned from enslaved people)", url: "https://wvencyclopedia.org/entries/314"}
      - {title: "Ballad of America (African-rooted downstroke)", url: "https://balladofamerica.org/banjo/"}
  - claim: "The akonting of the Jola of Senegambia is the closest known African relative: calabash body with goat skin, long neck, short thumb string, same downstroke"
    sources:
      - {title: "NPR: The Banjo's Roots Reconsidered (2011)", url: "https://www.npr.org/transcripts/139880625"}
      - {title: "UCLA Ethnomusicology Review: Historical Narratives of the Akonting and Banjo", url: "https://ethnomusicologyreview.ucla.edu/node/763"}
  - claim: "The banjo's bright sound cut through early jazz bands"
    sources:
      - {title: "McClung Museum: The Banjo (only stringed instrument loud enough above the horns)", url: "https://mcclungmuseum.utk.edu/exhibitions/the-banjo-from-africa-to-america-and-beyond/"}
      - {title: "Ballad of America (loud, bright sound cut through jazz bands)", url: "https://balladofamerica.org/banjo/"}
  - claim: "Black and white string bands played banjo at Appalachian dances"
    sources:
      - {title: "Ballad of America (White, Black and integrated string bands for square and step dances in southern Appalachia)", url: "https://balladofamerica.org/banjo/"}
      - {title: "McClung Museum (Appalachian social music for dancing; Black and white musicians)", url: "https://mcclungmuseum.utk.edu/exhibitions/the-banjo-from-africa-to-america-and-beyond/"}
  - claim: "The banjo is prominent in bluegrass"
    sources:
      - {title: "McClung Museum", url: "https://mcclungmuseum.utk.edu/exhibitions/the-banjo-from-africa-to-america-and-beyond/"}
      - {title: "e-WV: Banjo (Scruggs-style bluegrass)", url: "https://wvencyclopedia.org/entries/314"}
  - claim: "Places reordered: The Gambia (Jola country, akonting homeland) first as place of origin, South Carolina Lowcountry second as place of early American spread"
    sources:
      - {title: "UCLA Ethnomusicology Review (Jola, Senegambia)", url: "https://ethnomusicologyreview.ucla.edu/node/763"}
      - {title: "NPR (Jatta, Jola, Gambia)", url: "https://www.npr.org/transcripts/139880625"}
gullah:
  - claim: "Gullah (Geechee) is a creole that grew from English and many African languages"
    sources:
      - {title: "NPS: Gullah Geechee Cultural Heritage Corridor (a creole language)", url: "https://www.nps.gov/guge/index.htm"}
      - {title: "University of Chicago Magazine: Lorenzo Dow Turner (amalgam of English and multiple African languages)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml"}
  - claim: "Most of its vocabulary is English, but its grammar does not simply follow English"
    sources:
      - {title: "University of Chicago Magazine (English-based vocabulary; grammatical number, serial verbs)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml"}
      - {title: "Kenyon College: American Language, African Roots (grammatical constructions not resembling English)", url: "https://digital.kenyon.edu/gullah_language.html"}
  - claim: "It keeps African words such as kuta (turtle) and thousands of African personal names"
    sources:
      - {title: "Folkstreams: Dr. Lorenzo Turner and the Gullah Language (kuta, turtle; thousands of personal names)", url: "https://www.folkstreams.net/contexts/dr-lorenzo-turner-and-the-gullah-language"}
      - {title: "University of Chicago Magazine (cootuh, turtle; 3,600 basket names)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml"}
  - claim: "Its speakers descend from Africans enslaved on rice, Sea Island cotton and indigo plantations of the South Carolina and Georgia coast; isolation let them keep many African traditions"
    sources:
      - {title: "NPS: Gullah Geechee Cultural Heritage Corridor", url: "https://www.nps.gov/guge/index.htm"}
      - {title: "University of Chicago Magazine (rice coast, Charleston and Savannah; cloistered Sea Island communities)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml"}
  - claim: "Turner's 1949 book traced thousands of Gullah words and names to African languages"
    sources:
      - {title: "Folkstreams (nearly 4,000 items of African origin)", url: "https://www.folkstreams.net/contexts/dr-lorenzo-turner-and-the-gullah-language"}
      - {title: "University of Chicago Magazine", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml"}
  - claim: "Places reordered: Sea Islands, South Carolina first (where Gullah arose), Harris Neck second"
    sources:
      - {title: "NPS: Gullah Geechee Cultural Heritage Corridor", url: "https://www.nps.gov/guge/index.htm"}
      - {title: "University of Chicago Magazine (Sea Islands of South Carolina and Georgia)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml"}
steelpan:
  - claim: "A steelpan is made from a 55-gallon oil drum"
    sources:
      - {title: "Discover Trinidad and Tobago: The steelpan", url: "https://www.discovertnt.com/articles/Trinidad/Steelbands/136/3/19"}
      - {title: "Oxford Business Group: The story of the steel drum (55-gallon oil drum)", url: "https://oxfordbusinessgroup.com/reports/trinidad-tobago/2015-report/economy/the-story-of-the-steel-drum-in-trinidad-and-tobago"}
  - claim: "Its surface is grooved into separate sections, each hammered to a definite pitch"
    sources:
