      - {title: "Discover Trinidad and Tobago", url: "https://www.discovertnt.com/articles/Trinidad/Steelbands/136/3/19"}
      - {title: "National Trust of Trinidad and Tobago: Panyards", url: "https://nationaltrust.tt/panyards-of-trinidad/"}
  - claim: "Tamboo bamboo arose after colonial authorities banned drumming; when bamboo was banned in turn, the oil drum took its place"
    sources:
