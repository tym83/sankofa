  - claim: "Bands of a hundred players and more rehearse in panyards"
    sources:
      - {title: "Discover Trinidad and Tobago (100-person orchestras; panyards)", url: "https://www.discovertnt.com/articles/Trinidad/Steelbands/136/3/19"}
