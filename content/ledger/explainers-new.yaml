      - {title: "Discover Trinidad and Tobago (notes grooved, hammered precise in pitch)", url: "https://www.discovertnt.com/articles/Trinidad/Steelbands/136/3/19"}
  - claim: "Tenor/lead pans carry the melody, mid-range pans are like guitars and cellos, plus bass pans"
    sources:
      - {title: "Discover Trinidad and Tobago (tenor/lead pan carries melody; seconds, guitar, cello, bass pans)", url: "https://www.discovertnt.com/articles/Trinidad/Steelbands/136/3/19"}
