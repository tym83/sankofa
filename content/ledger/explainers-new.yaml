      - {title: "Carnegie Hall, Timeline of African American Music: House", url: "https://timeline.carnegiehall.org/genres/house"}
      - {title: "GRAMMY.com: A house music timeline", url: "https://www.grammy.com/news/house-music-timeline-important-artists-songs-moments"}
  - claim: "Tempo around 120 to 130 beats a minute (Carnegie: 120–135; Grammy: 115–130)"
