  - claim: "Njoya simplified the signs through six versions"
    sources:
      - {title: "The Unicode Standard, chapter 19: Bamum ('rapidly simplified through six stages')", url: "https://www.unicode.org/versions/Unicode18.0.0/core-spec/chapter-19/"}
      - {title: "Kenneth J. Orosz, Njoya's Alphabet (2015) (the sixth revision in 1910 produced A ka u ku)", url: "https://journals.openedition.org/etudesafricaines/18002"}
  - claim: "In Foumban the script served for letters, court cases, records of births, deaths and land sales, medicine and a history of the Bamum people"
    sources:
      - {title: "Kenneth J. Orosz, Njoya's Alphabet (2015) (correspondence, pharmacopeia; from 1912 births, deaths, land sales, court cases; history of the Bamum)", url: "https://journals.openedition.org/etudesafricaines/18002"}
      - {title: "Tim Brookes, Endangered Alphabets: A tragic tale, a hopeful future (record of the history of the kingdom; administrative records and legal codes)", url: "https://www.endangeredalphabets.com/2015/11/18/a-tragic-tale-a-hopeful-future/"}
  - claim: "It was taught in schools Njoya founded in and around Foumban"
    sources:
      - {title: "Kenneth J. Orosz, Njoya's Alphabet (2015) (palace school 1910; 20 schools by 1918)", url: "https://journals.openedition.org/etudesafricaines/18002"}
      - {title: "Tim Brookes, Endangered Alphabets (the king created schools in Foumban and nearby towns)", url: "https://www.endangeredalphabets.com/2015/11/18/a-tragic-tale-a-hopeful-future/"}
  - claim: "Correction (wow and dispute): counts of the first signs differ — about 500 (Unicode), some 465 (Endangered Alphabets), more than 1,000 (Orosz); wow now says 'hundreds'"
    sources:
      - {title: "The Unicode Standard, chapter 19: Bamum (approximately 500 logographic symbols)", url: "https://www.unicode.org/versions/Unicode18.0.0/core-spec/chapter-19/"}
      - {title: "Kenneth J. Orosz, Njoya's Alphabet (2015) ('more than 1,000 symbols')", url: "https://journals.openedition.org/etudesafricaines/18002"}
      - {title: "Tim Brookes, Endangered Alphabets ('collected some 465 symbols')", url: "https://www.endangeredalphabets.com/2015/11/18/a-tragic-tale-a-hopeful-future/"}
vai-script:
  - claim: "The Vai script is written from left to right"
    sources:
      - {title: "The Unicode Standard 17.0, chapter 19: Vai ('a syllabic script written left to right')", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"}
      - {title: "S. W. Koelle, Narrative of an Expedition into the Vy Country (1849) ('performed from the left hand to the right') — primary", url: "https://archive.org/stream/narrativeofexped00koeliala/narrativeofexped00koeliala_djvu.txt"}
  - claim: "It has been used for ordinary purposes: letters, accounts, records of trade"
    sources:
      - {title: "The Unicode Standard 17.0, chapter 19: Vai (correspondence and record-keeping, mainly among merchants and traders)", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"}
      - {title: "Kelly et al., Current Anthropology (letter writing and household administration)", url: "https://bura.brunel.ac.uk/bitstream/2438/28951/3/FullText.pdf"}
  - claim: "It is learned informally, from someone who can write, by doing; and it is still in use today"
    sources:
      - {title: "The Unicode Standard 17.0, chapter 19: Vai ('nowadays the script is learned informally')", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"}
      - {title: "Kelly et al., Current Anthropology (transmission largely informal; learners seek out a literate individual; learn-by-doing; remains in active use today)", url: "https://bura.brunel.ac.uk/bitstream/2438/28951/3/FullText.pdf"}
  - claim: "Bukẹlẹ said the idea came to him in a dream in which a messenger showed him a book and taught him to write Vai words (also wow); Koelle recorded it from him and published it in 1849"
    sources:
      - {title: "The Unicode Standard 17.0, chapter 19: Vai (he later stated that the inspiration had come to him in a dream)", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"}
      - {title: "S. W. Koelle, Narrative of an Expedition into the Vy Country (1849), pp. 21-22 (Doalu Bukara's account of the dream) — primary", url: "https://archive.org/stream/narrativeofexped00koeliala/narrativeofexped00koeliala_djvu.txt"}

