- card: equiano
  claim: It tells of a childhood in Igbo country, kidnapping and the Middle Passage
  verdict: confirmed
  sources:
    - title: "University of Oxford, English Faculty: The Interesting Narrative by Olaudah Equiano"
      url: https://english.web.ox.ac.uk/node/1250811
    - title: "Colonial Williamsburg, Slavery and Remembrance: Olaudah Equiano"
      url: https://www.slaveryandremembrance.org/people/person/?id=PP003
  note: >-
    Oxford: "born at Essaka, an Igbo town in present-day Nigeria"; "at the age of 11 he
    was kidnapped by African traders, sold to European slavers, and transported to the
    West Indies". Colonial Williamsburg: per his Narrative he "was born into an Igbo
    community", "captured from his village", and survived the crossing. Also seen:
    London Museum (kidnapping, "horrors of the Middle Passage") and Brycchan Carey
    (first-person account of "the middle passage", plus the Carretta birthplace dispute).
    The claim is about what the book tells, so the dispute does not affect it; keep the
    card's existing dispute note.

- card: saint-georges
  claim: In 1772 he played his own concertos with the Concert des Amateurs
  verdict: confirmed
  sources:
    - title: "Handel and Haydn Society: Joseph Bologne through the years"
      url: https://handelandhaydn.org/joseph-bologne-chevalier-de-saint-georges-through-the-years/
    - title: "BBC Music Magazine (Paul Riley): Joseph Bologne"
      url: https://www.classical-music.com/features/composers/bologne-joseph
  note: >-
    H&H: in 1772 "he performed his own violin concertos with the Concert des Amateurs in
    Paris", becoming its director the next year. BBC Music Magazine: he made his solo
    debut with the Concert des Amateurs "the previous year" (before Gossec handed him
    the orchestra in 1773), playing his two violin concertos Op. 2, citing Le Mercure.
    BBC gives the year by implication, not as a printed "1772".

- card: detroit-techno
  claim: "Media caption: the Atkins photo was taken in Detroit"
  verdict: unverified
  sources:
    - title: "Wikimedia Commons: File:Juan Atkins.jpg"
      url: https://commons.wikimedia.org/wiki/File:Juan_Atkins.jpg
    - title: "Flickr (Angie Linder / technochick): Hel10, the source photo"
      url: https://www.flickr.com/photos/technochick/4307848491/
  note: >-
    Licence confirmed: CC BY-SA 2.0, author Angie Linder, taken 2010-01-18. Location is
    NOT supported: Commons gives "Angie Linder from Detroit, USA", which is the
    photographer's profile location ("location":"Detroit, USA" on the Flickr account),
    not where the photo was taken. The Flickr photo has no geotag; its tags are "dj,
    detroit, techno, militia, t1000, detroittechnomilitia, necto, juanatkins". "necto"
    points to The Necto nightclub in Ann Arbor, Michigan, so "Detroit" may be wrong.
    Keep the location out of the caption (or say "Michigan" only if confirmed).

- card: aro-and-dahomey
  claim: The Atlantic trade needed African sellers; states and merchant networks supplied them
  verdict: confirmed
  sources:
    - title: "Robin Law: Ouidah (Ohio University Press)"
      url: https://www.ohioswallow.com/9780821415726/ouidah/
    - title: "J. N. Oriji: Slave trade, warfare and Aro expansion in the Igbo hinterland (AfricaBib abstract)"
      url: https://africabib.org/rec.php?RID=189555858
  note: >-
    Law: Ouidah, "the second-most-important town of the Dahomey kingdom", was "the most
    important embarkation point for slaves" on the Slave Coast, an African-run trading
    centre whose private merchants dealt with the Dahomian monarchy (state + merchants).
    Oriji: "the Aro of the Cross River basin area ... emerged as the leading slave
    traders in the Igbo hinterland" (merchant network). Ronen (Persee) also opened: he
    accepts the Dahomean king sold captives but disputes the profit motive, so it
    supports the supply role, not motive claims. Nwokeji excerpt PDF could not be
    downloaded (timeout); not needed.

