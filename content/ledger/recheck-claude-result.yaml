# Phase 2 re-check by Claude (Agent B) of 18 contested claims.
# Checked 2026-11-12. Every URL listed below was opened during this re-check.

- card: hurston
  claim: She went south to collect folklore
  verdict: confirmed
  sources:
    - title: "National Park Service: Zora Neale Hurston and Cudjo's Own Story"
      url: https://www.nps.gov/articles/000/zora-neale-hurston-and-cudjo-s-own-story.htm
    - title: "Library of Congress: Her Eyes Were Watching Everything"
      url: https://blogs.loc.gov/families/2025/01/her-eyes-were-watching-everything-zora-neale-hurston-at-the-library-of-congress/
  note: >-
    NPS: "She was to travel for six months throughout Florida and other places in the
    South to collect folklore." LoC: she "traveled to the southern United States and the
    Caribbean many times over the years as a folklorist".

- card: octavia-butler
  claim: The 2020 bestseller was Parable of the Sower
  verdict: confirmed
  sources:
    - title: "SYFY Wire: Octavia Butler reaches New York Times bestseller list (2020-09-03)"
      url: https://www.syfy.com/syfy-wire/octavia-butler-new-york-times-bestseller-list-parable-of-sower
    - title: "Locus: Butler on Bestseller List"
      url: https://locusmag.com/2020/10/butler-on-bestseller-list/
  note: >-
    SYFY names 1993's Parable of the Sower as the book that reached the list. Locus
    (fetched directly; WebFetch got 502, curl worked): #14 paperback fiction, week ending
    2020-08-29, printed 2020-09-13, her first appearance on the list. Independent reports.

- card: tutuola
  claim: He wrote it in his own English
  verdict: confirmed
  sources:
    - title: "Eustace Palmer: Twenty-five Years of Amos Tutuola (International Fiction Review)"
      url: https://journals.lib.unb.ca/index.php/IFR/article/download/13280/14363/17988
    - title: "The Irish Times: The Palm-Wine Drinkard"
      url: https://www.irishtimes.com/culture/books/the-palm-wine-drinkard-by-amos-tutuola-1.2084537
  note: >-
    Palmer (PDF text extracted) discusses "Tutuolan English", critics calling it
    "West-African English", and argues it is "Yoruba English representing the interaction
    between Yoruba deep grammar and English surface grammar". Irish Times: "its
    idiosyncratic style captures brilliantly the continent's speech rhythms". "His own
    English" is a fair plain-language gloss of both.

- card: dave-the-potter
  claim: "Media caption: jar made at Stony Bluff Manufactory, Edgefield District"
  verdict: confirmed
  sources:
    - title: "Metropolitan Museum of Art: Storage jar, 1858 (collection record)"
      url: https://www.metmuseum.org/art/collection/search/747045
    - title: "Metropolitan Museum of Art Open Access API: object 747045"
      url: https://collectionapi.metmuseum.org/public/collection/v1/objects/747045
  note: >-
    The HTML record returned 429, so the same record was read through the Met's
    official collection API: maker "Dave (later recorded as David Drake)", 1858,
    alkaline-glazed stoneware, "made at Stony Bluff Manufactory, Old Edgefield District,
    South Carolina", manufacturer role "Stony Bluff Manufactory", isPublicDomain true.
    Both entries are the rights holder's own record (per RECHECK rule for media/licence
    claims). The record says "Old Edgefield District"; the caption may keep "Edgefield
    District".

