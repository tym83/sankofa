- card: rinse-fm
  claim: Transmitters were moved from block to block and torn down by the DTI/Ofcom
  verdict: confirmed
  sources:
    - title: "Time Out: Thirty years of Rinse FM"
      url: https://www.timeout.com/london/music/rinse-fm-cover-interview
    - title: "Dazed: Rinse FM at 30, an oral history"
      url: https://www.dazeddigital.com/music/article/62542/1/rinse-fm-at-30-an-oral-history-of-the-notorious-east-london-radio
  note: >-
    Time Out: "constantly replacing transmitters and moving around different blocks in
    the area"; Geeneus mentions Ofcom switching stations off and authorities taking "a
    transmitter off us every day for 13 days". Dazed: transmitters hidden in tower
    blocks/flats, and the Ingram House transmitter "went off" as DTI officers came out.
    Wording note: the sources say transmitters were seized/taken, not literally "torn
    down"; "seized" is the more exact verb (Dazed uses "tore down" only for rival crews).

- card: rosetta-tharpe
  claim: She was a Pentecostal gospel singer with a guitar
  verdict: confirmed
  sources:
    - title: "Rock and Roll Hall of Fame: Sister Rosetta Tharpe"
      url: https://www.rockhall.com/inductees/sister-rosetta-tharpe
    - title: "Gayle Wald: Why We Keep Rediscovering the Flamboyant Godmother of Rock"
      url: https://whatitmeanstobeamerican.org/encounters/why-we-keep-rediscovering-the-flamboyant-godmother-of-rock/
  note: >-
    Rock Hall: "heartfelt gospel folksiness", her Gibson Les Paul Custom, and "the rich
    musical traditions of black Pentecostalism". Wald: "a musical prodigy of the Church
    of God in Christ", "a Pentecostal denomination", "gospel's first superstar", with
    detail on her electric guitar playing.

- card: big-mama-thornton
  claim: In August 1952 Thornton recorded 'Hound Dog'
  verdict: confirmed
  sources:
    - title: "Michael Spörke, Library of Congress National Recording Registry essay: Hound Dog"
      url: https://www.loc.gov/static/programs/national-recording-preservation-board/documents/HoundDog.pdf
    - title: "HISTORY: Hound Dog is recorded for the first time by Big Mama Thornton"
      url: https://www.history.com/this-day-in-history/august-13/hound-dog-is-recorded-for-the-first-time-by-big-mama-thornton
  note: >-
    LoC essay (PDF text extracted): "On 13 August 1952, Willie Mae Thornton ... recorded,
    with Johnny Otis and his orchestra". HISTORY: recorded August 13, 1952, in Los
