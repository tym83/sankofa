  - {status: recheck-confirmed, fact: "In 1817 Thomas Bowdich, on a mission to the Asante capital, acquired a stamped adinkra cloth (now in the British Museum)"}
  - {status: agreed, fact: "The Sankofa sign is drawn as a bird looking back"}
  - {status: recheck-confirmed, fact: "Sankofa expresses heritage as a tool to build the future"}
  - {status: disputed, fact: "A heart of tacks on a colonial-era coffin lid at New York's African Burial Ground was hailed as Sankofa, a reading now contested"}
  - {status: agreed, fact: "Media: stamped adinkra cloth acquired by Bowdich in Kumasi 1817, British Museum; photo of 2D work, public domain via Wikimedia Commons"}
