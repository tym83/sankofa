# Phase 3 ledger: the facts each final card and chapter uses, with their
# status path: agreed (both agents confirmed), recheck-confirmed (one
# confirmed, the other confirmed on re-check), corrected (used in the
# corrected form both agents support), disputed (kept only as contested,
# with the card dispute field set). Media facts are listed when the media
# entry is kept.
achebe:
  - {status: recheck-confirmed, fact: "Achebe was born in Ogidi in eastern Nigeria in 1930"}
  - {status: recheck-confirmed, fact: "He was working in Lagos when he mailed the manuscript"}
  - {status: agreed, fact: "He mailed his handwritten novel to a London typing agency, which went silent / it vanished there (also wow)"}
  - {status: agreed, fact: "Angela Beattie retrieved the manuscript"}
  - {status: corrected, fact: "Beattie, his broadcasting supervisor, visited the agency while on leave and demanded that it post the typed manuscript to Lagos; personal collection is not what Achebe's account says."}
  - {status: agreed, fact: "Heinemann printed 2,000 copies in 1958"}
  - {status: recheck-confirmed, fact: "He took the title from Yeats's 'The Second Coming'"}
  - {status: recheck-confirmed, fact: "He wrote out of indignation at Joyce Cary's Mister Johnson, to tell an Igbo village's story from the inside"}
  - {status: recheck-confirmed, fact: "Heinemann built the African Writers Series around it in 1962, with Achebe as editorial adviser for ten years"}
  - {status: recheck-confirmed, fact: "In 1975 at Amherst he called Conrad's Heart of Darkness racist"}
  - {status: agreed, fact: "Media: Achebe at Asbury Hall, Buffalo, 25 Sep 2008; Stuart C. Shapiro via Wikimedia Commons; CC BY 3.0"}
adinkra:
