placePolicy: First markers identify the supported place or region of origin. Where
  no single birthplace is established, the label states a region and identifies the
  representative point; coordinates are not evidence of an invention at that point.
accessNotes:
- Orosz’s OpenEdition article/PDF returned a JavaScript bot challenge. Bamum decisions
  instead use read Unicode text, Kelly’s deposited research chapter, Brookes and British
  Library archival records. The detailed administrative list was narrowed accordingly.
- Several Smithsonian, university and newspaper pages rejected direct downloads but
  exposed readable text through the web index. Where neither route provided the relevant
  passage, that source was not used as affirmative evidence.
- The two sources listed for an unverified claim record what was checked; they do
  not both support the removed claim. Numeric house tempo and the samba kitchen-utensil
  detail were removed for lack of independent corroboration in this check.
