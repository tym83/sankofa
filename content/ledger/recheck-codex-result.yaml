- card: zong
  claim: In late 1781 the Liverpool-owned slave ship Zong overshot Jamaica
  verdict: confirmed
  sources:
  - title: 'Understanding Slavery Initiative: The Zong (442 captives; Liverpool Gregson syndicate; sailed
      past Jamaica)'
    url: https://understandingslavery.com/casestudy/the-zong/
  - title: HISTORY.com (442)
    url: https://history.com/this-day-in-history/zong-slave-ship-trial
  note: Both accounts identify Liverpool ownership and the 1781 navigational error past Jamaica.
- card: zong
  claim: The killings took place between 29 November and 1 December
  verdict: unverified
  sources:
  - title: Understanding Slavery Initiative (132, 29 Nov–1 Dec)
    url: https://understandingslavery.com/casestudy/the-zong/
  - title: Insurance Museum (132 total; 122 thrown, 10 jumped, 29 Nov–early Dec)
    url: https://insurance.museum/?p=17318
  note: One museum dates the killings through 1 December; the other gives only early December. The exact
    end date is not independently resolved by these sources.
- card: zong
  claim: The jury trial was at London's Guildhall in March 1783
  verdict: unverified
  sources:
  - title: London Museum (Guildhall trial March 1783, owners won)
    url: https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/
  - title: Understanding Slavery Initiative (London jury March 1783 found for owners)
    url: https://understandingslavery.com/casestudy/the-zong/
  note: London Museum specifies Guildhall in March 1783. The other source establishes the litigation chronology
    but not independently the venue.
- card: zong
  claim: Equiano carried the news to Granville Sharp
  verdict: confirmed
  sources:
  - title: Understanding Slavery Initiative (19 March 1783)
    url: https://understandingslavery.com/casestudy/the-zong/
  - title: HISTORY.com (Equiano told Sharp)
    url: https://history.com/this-day-in-history/zong-slave-ship-trial
  note: Both accounts identify Equiano as the person who brought the case to Sharp's attention.
- card: zong
  claim: Sharp demanded a murder trial and never got one
  verdict: confirmed
  sources:
  - title: London Museum (no one was ever prosecuted)
    url: https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/
  - title: Insurance Museum (Sharp tried to bring criminal charges, without success)
    url: https://insurance.museum/?p=17318
  note: Both histories describe Sharp's demand for a murder prosecution and the absence of such a trial.
- card: zong
  claim: In May Lord Mansfield's court granted the insurers a new trial; there is no evidence it was ever
    held
  verdict: confirmed
  sources:
  - title: Understanding Slavery Initiative (22 May 1783, Mansfield; no evidence of new trial)
    url: https://understandingslavery.com/casestudy/the-zong/
  - title: Insurance Museum (Mansfield ordered a new trial; no record of it)
    url: https://insurance.museum/?p=17318
  note: Both describe the May 1783 order for a retrial and the lack of evidence that it occurred. This
    is absence of a surviving record, not proof of a documented cancellation.
- card: zong
  claim: Sharp had the hearing taken down, and the record is most of what survives
  verdict: unverified
  sources:
  - title: Understanding Slavery Initiative ('recorded at Granville Sharp's request. Most of what we know
      ... derives from that report')
    url: https://understandingslavery.com/casestudy/the-zong/
  - title: Royal Museums Greenwich REC/19 (transcript of proceedings among Sharp's documents)
    url: https://www.rmg.co.uk/collections/archive/rmgc-object-500960
  note: The case study explains Sharp's recording effort and the archive holds those papers. The stronger
    quantitative claim that this is most of everything surviving is not independently established.
- card: zong
  claim: In 2008 M. NourbeSe Philip built Zong! only from the words of the case report Gregson v. Gilbert
  verdict: confirmed
  sources:
  - title: 'McGill Faculty of Law: Zong! ''composed entirely from the words of ... Gregson v. Gilbert'''
    url: https://mcgill.ca/law/node/8889
  - title: 'M. NourbeSe Philip: Set Speaks, author’s account of Zong!'
    url: https://www.setspeaks.com/backstory/
  note: The author’s own statement identifies the 2008 book and its constraint to the legal report’s words
    and components; McGill independently discusses that compositional method. The statement concerns the
    poem, not every word of its notes and apparatus.
