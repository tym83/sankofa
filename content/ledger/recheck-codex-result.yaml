  verdict: unverified
  sources:
  - title: 'Hood Museum of Art, Dartmouth: Ukara cloth of the Ekpe society'
    url: https://hoodmuseum.dartmouth.edu/node/7361
  - title: 'UBC Press: Ivor L. Miller, Voice of the Leopard'
    url: https://ubcpress.ca/voice-of-the-leopard
  note: The Hood Museum explicitly relates nsibidi to Ekpe. The publisher's summary establishes the leopard
    society but does not independently substantiate the script detail.
- card: v0
  claim: Akan cloth carries adinkra signs, among them Sankofa, 'go back and get it'
  verdict: confirmed
  sources:
  - title: 'Museum of Anthropology at UBC: Sankofa, African Routes, Canadian Roots (2021)'
    url: https://moa.ubc.ca/2021/11/sankofa-african-routes-canadian-roots/
  - title: 'Smithsonian NMAAHC: Kwanzaa resource, Sankofa adinkra symbol'
    url: https://nmaahc.si.edu/sites/default/files/downloads/resources/kwanzaa_coloring_pages.pdf
  note: UBC provides the Akan/adinkra context and translation; the Smithsonian independently labels Sankofa
    and gives the same meaning.
- card: v0
  claim: Kente weavers name every pattern they make
  verdict: corrected
  sources:
  - title: 'North Carolina Museum of Art: Man''s Cloth in the Darkoro Yesre pattern'
    url: https://learn.ncartmuseum.org/artwork/mans-cloth-in-the-darkoro-yesre-certainly-one-day-you-will-laugh-pattern/
  - title: 'Bowers Museum: Weaving history, kente cloth and naming conventions in Ghana (2017)'
    url: https://bowers.org/index.php/collection/collections-blog/weaving-history-kente-cloth-and-naming-conventions-in-ghana
  note: Kente patterns are traditionally named, often with proverbs or historical associations. These
    museum accounts support that practice, not an exceptionless assertion that every pattern by every
    weaver has a name.
- card: v0
  claim: Some plaques show Portuguese traders
  verdict: confirmed
  sources:
  - title: 'Metropolitan Museum of Art: Plaque with Two Portuguese Merchants'
    url: https://www.metmuseum.org/art/collection/search/316490
  - title: 'Art Institute of Chicago: Double Plaque of a Portuguese Man'
    url: https://archive.artic.edu/benin/artwork/195413
  note: Two independent museum catalogues identify Portuguese figures on Benin plaques, replacing the
    inaccessible article and derivative image page.
- card: v0
  claim: Cowries came from the Maldives, were money across West Africa and became the price of human beings
  verdict: confirmed
  sources:
  - title: 'Citéco, Paris: Cowry shells, a form of currency'
    url: https://citeco.fr/en/cowries-
  - title: 'Justine Wintjes, The Conversation via Daily Maverick (2021): Small seashells tell a big story
      of slavery'
    url: https://www.dailymaverick.co.za/article/2021-09-28-small-seashells-tell-a-big-story-of-slavery-and-transoceanic-trade-500-years-ago/
  note: The monetary museum and independently authored archaeological account connect Maldivian cowries,
    West African currencies, and the Atlantic trade in enslaved people.
- card: v2
  claim: 'Hero: Raid of Second South Carolina Volunteers on the Combahee, Harper''s Weekly, 4 July 1863,
    LoC, public domain'
  verdict: unverified
  sources:
  - title: 'Dickinson College, House Divided: Union troops raid Confederate plantations on the Combahee
      River, June 1-3, 1863'
    url: https://hd.housedivided.dickinson.edu/node/40596
  note: Dickinson identifies Harper's Weekly, 4 July 1863, page 429. A second item-level source for the
    entire attribution, repository and rights claim was not established.
- card: v2
  claim: In Luanda Nzinga refused a floor mat and sat on a kneeling attendant to meet the Portuguese governor
    eye to eye
  verdict: corrected
  sources:
  - title: 'South African History Online: Njinga Ana de Sousa'
    url: https://sahistory.org.za/people/njinga-ana-de-sousa
  - title: 'Boston University (2011): The enduring power of Queen Njinga'
    url: https://www.bu.edu/articles/2011/the-enduring-power-of-queen-njinga
  note: According to the later account repeated in these histories, Nzinga used an attendant as a seat
    to meet the governor at equal height. Present it as a famous reported episode, not an independently
    documented verbatim encounter.
- card: v2
  claim: Palmares held out for about a century in the hills of northeast Brazil
  verdict: confirmed
  sources:
  - title: 'Fundação Cultural Palmares: O que significa quilombo'
    url: https://www.gov.br/palmares/pt-br/departamentos/protecao-preservacao-e-articulacao/serra-da-barriga-1/quilombo
  - title: 'Geledés / Rede de Historiadores Negros, Google Arts & Culture: Remembering Palmares'
    url: https://artsandculture.google.com/story/QQVxHr3UDLY8JQ
  note: Both place Palmares in the northeastern Brazilian hills and describe approximately a century of
    resistance. Exact final-destruction dates in popular summaries vary and are not asserted here.
- card: v2
  claim: The Windward Maroons of Nanny forced the British to sign treaties
  verdict: corrected
  sources:
  - title: 'Jamaica Information Service: Nanny of the Maroons'
    url: https://jis.gov.jm/information/heroes/nanny-of-the-maroons/
  - title: 'Jamaica Gleaner (2018): Nanny was real, not a myth'
    url: http://past.jamaica-gleaner.com/article/lead-stories/20181012/nanny-was-real-not-myth-govt-conferred-order-national-hero-nanny-1976
  note: The Windward Maroons secured a treaty in 1739, signed by Quao. Nanny reportedly opposed it; the
    separate Leeward treaty was signed by Cudjoe. Do not imply that Nanny signed multiple treaties.
- card: v2
  claim: The colony then banned drums, horns and loud instruments
  verdict: corrected
  sources:
  - title: South Carolina Court of Appeals opinion (1850) quoting section 36 of the 1740 Act
    url: https://hallapproved.com/sc/cases/appeals/1850/7471501/
  - title: 'Charleston County Public Library, Charleston Time Machine: Banjer Bay, Charleston 1766'
    url: https://www.ccpl.org/charleston-time-machine/banjer-bay-charleston-1766
  note: South Carolina's 1740 law restricted enslaved people's use of drums, horns and other loud instruments
    by penalizing owners who permitted it. It was not a general ban on every colonial inhabitant playing
    such instruments.
- card: v2
  claim: Haiti is the only nation born of a successful slave rebellion
  verdict: unverified
  sources:
  - title: 'Colonial Williamsburg, Slavery and Remembrance: Haiti'
    url: https://slaveryandremembrance.org/articles/article/?id=A0111
  - title: 'US Office of the Historian: The United States and the Haitian Revolution'
    url: https://history.state.gov/milestones/1784-1800/haitian-rev
  note: Both establish Haiti's origin in slave revolt, but the worldwide exclusivity claim is explicit
    in only one of these institutional accounts.
- card: v2
  claim: France later made Haiti pay for its own freedom
  verdict: corrected
  sources:
  - title: 'BnF, France in the Americas: Haiti''s independence debt'
    url: https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922
  - title: The New York Times, Haiti debt data (GitHub)
    url: https://github.com/nytimes/haiti-debt
  note: France imposed an indemnity in 1825 as the price of recognizing Haitian independence, already
    declared in 1804. It was payment for recognition under coercion, not the original purchase of emancipation.
- card: v2
  claim: Walker's Appeal was carried south
  verdict: confirmed
  sources:
  - title: 'PBS, Africans in America: David Walker'
    url: https://www.pbs.org/wgbh/aia/part4/4p2930.html
  - title: 'Documenting the American South: David Walker (Dictionary of North Carolina Biography)'
    url: https://docsouth.unc.edu/nc/walker/bio.html
  note: PBS and UNC independently describe the Appeal's circulation in the southern states.
- card: v2
  claim: Smalls put on a captain's hat and steamed past Fort Sumter
  verdict: confirmed
  sources:
  - title: 'National Park Service: Robert Smalls'
    url: https://www.nps.gov/people/robert-smalls.htm
  - title: 'Henry Louis Gates Jr., PBS: Which slave sailed himself to freedom?'
    url: https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/which-slave-sailed-himself-to-freedom/
  note: The NPS history and Gates's PBS account both describe the captain's hat, signals and passage past
    Fort Sumter.
- card: v2
  claim: The Combahee raid did it in one night
  verdict: corrected
  sources:
  - title: 'National Park Service: We Called Ourselves Combee'
    url: https://www.nps.gov/articles/000/we-called-ourselves-combee.htm
  - title: 'National Archives: Harriet Tubman'
    url: https://www.archives.gov/research/african-americans/individuals/harriet-tubman
  note: The expedition travelled on the night of 1–2 June 1863 and the raid and liberation continued on
    2 June. 'In one night' compresses operations that extended into the following morning.
- card: v2
  claim: The Underground Railroad quilt code is a later invention
  verdict: corrected
  sources:
  - title: 'National Geographic (2004): Did quilts hold codes to the Underground Railroad?'
    url: https://www.nationalgeographic.com/culture/article/did-quilts-hold-codes-to-the-underground-railroad
  - title: 'International Quilt Museum, World Quilts: Underground Railroad Quilts?'
    url: https://worldquilts.quiltstudy.org/americanstory/node/123
  note: The quilt-code story is a modern claim without established contemporary documentation. The sources
    support calling it unsubstantiated, not a demonstrated deliberate fabrication.
- card: v2
  claim: In 1900 Yaa Asantewaa led the siege of the British fort at Kumasi
  verdict: unverified
  sources:
  - title: Lady Hodgson, The Siege of Kumassi (London, 1901), Internet Archive
    url: https://archive.org/stream/siegeofkumassi00hodg/siegeofkumassi00hodg_djvu.txt
  - title: 'Seychelles Nation (2016): Queen Mother Yaa Asantewaa honoured'
    url: https://nation.sc/article.html?id=251467
  note: The memoir documents the siege and the independent account identifies Yaa Asantewaa's leadership
    of the war. Direct command of the specific fort siege is not independently established by both.
- card: wedgwood-medallion
  claim: It was probably modelled by William Hackwood
  verdict: confirmed
  sources:
  - title: V&A article
    url: https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion
  - title: 'Historic Deerfield: Wedgwood''s anti-slavery medallion'
    url: https://www.historic-deerfield.org/2020-9-21-wedgwoods-anti-slavery-medallion/
  note: Both museum accounts attribute the modelling to Hackwood; 'probably' correctly preserves the attribution's
    uncertainty.
- card: wedgwood-medallion
  claim: In 1788 Wedgwood sent a batch to Benjamin Franklin in Philadelphia
  verdict: confirmed
  sources:
  - title: V&A article (1788, Franklin in America)
    url: https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion
  - title: Historic Deerfield (large package to Franklin; Franklin's reply to Wedgwood's letter of 29
      February)
    url: https://www.historic-deerfield.org/2020-9-21-wedgwoods-anti-slavery-medallion/
  note: Both museum histories describe the 1788 shipment to Franklin and his Philadelphia abolition work.
- card: wedgwood-medallion
  claim: Specifically as bracelets and hairpins (also wow)
  verdict: unverified
  sources:
  - title: Clarkson (1808), vol. II (snuff-boxes, bracelets, pins for hair)
    url: https://www.gutenberg.org/ebooks/12507
  - title: V&A article
    url: https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion
  note: V&A quotes Clarkson on bracelets and hairpins. The supplied Gutenberg landing page identifies
    the book but does not itself expose the passage; independent contextual analysis was not established.
- card: work-songs
  claim: In the 1790s a doctor working in Sierra Leone described rowers singing with a soloist and a chorus
    (also wow)
  verdict: confirmed
  sources:
  - title: Carnegie Hall Timeline (Winterbottom, physician in Sierra Leone 1792–96)
    url: https://timeline.carnegiehall.org/genres/work-songs-field-street-calls-satirical-protest-songs
  - title: 'Thomas Winterbottom: An Account of the Native Africans, volume 1, full text'
    url: https://archive.org/stream/accountofnativea01wint/accountofnativea01wint_djvu.txt
  note: The book’s rowing passage directly describes a solo couplet followed by a collective response;
    Carnegie dates Winterbottom’s Sierra Leone residence to 1792–1796. The book was published in 1803,
    so the 1790s dates refer to observation, not publication.
- card: work-songs
  claim: The songs lived on in road gangs and prisons
  verdict: confirmed
  sources:
  - title: Carnegie Hall Timeline (prison farm work groups sang work songs)
    url: https://timeline.carnegiehall.org/genres/work-songs-field-street-calls-satirical-protest-songs
  - title: 'Bunk History / Scalawag: The Blues Behind Bars'
    url: https://bunkhistory.org/resources/how-southern-prisons-shaped-american-music
  note: The music-history account and independent prison-music history describe the continuation of work
    songs in penal labour and road gangs.
