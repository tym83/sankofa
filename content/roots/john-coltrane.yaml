story: John Coltrane developed as a sideman in jazz bands before leading his own groups. Joining Miles Davis’s band in 1955 brought that apprenticeship to a new stage.
storyRu: Прежде чем возглавить собственные ансамбли, Джон Колтрейн набирался опыта в чужих джазовых группах. В 1955 году он вошёл в ансамбль Майлза Дэвиса — это стало новым этапом его становления.
