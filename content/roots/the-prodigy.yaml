story: "The Prodigy took a vocal phrase from Ultramagnetic MCs’ “Give the Drummer Some”. Looping Kool Keith’s voice made it the hook of “Smack My Bitch Up”."
storyRu: "The Prodigy взяли вокальную фразу из «Give the Drummer Some» группы Ultramagnetic MCs. Зацикленный голос Кула Кита стал главной вокальной фразой «Smack My Bitch Up»."
