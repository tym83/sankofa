story: Dinah Washington helped shape Amy Winehouse’s musical style, and Frank included
  the jazz standard “Moody’s Mood for Love”. “Tears Dry on Their Own” is built
  on a sample of Marvin Gaye and Tammi Terrell’s “Ain’t No Mountain High Enough”.
storyRu: Дайна Вашингтон повлияла на музыкальный стиль Эми Уайнхаус, а в «Frank» вошёл
  джазовый стандарт «Moody’s Mood for Love». А «Tears Dry on Their Own» построена
  на сэмпле из «Ain’t No Mountain High Enough» Марвина Гэя и Тамми Террелл.
