story: "King Tubby made existing Jamaican rhythm tracks into material for new music. By removing and returning parts and adding echo, he helped develop dub."
storyRu: "Кинг Табби превращал готовые ямайские ритм-треки в материал для новой музыки. Убирая и возвращая партии и добавляя эхо, он развивал даб."
