  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: quests.sankofa.kuberoot.dev
spec:
  group: sankofa.kuberoot.dev
  names:
    kind: Quest
    listKind: QuestList
    plural: quests
