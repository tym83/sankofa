                type: object
              wow:
                description: The one-line hook.
                type: string
              years:
                items:
                  type: integer
                maxItems: 2
                minItems: 1
                type: array
              zoom:
                description: 'Atlas zoom: 1 centuries, 2 regions, 3 cities and genres,
                  4 people, 5 a document.'
                maximum: 5
                minimum: 1
                type: integer
            required:
            - body
            - books
            - kind
            - places
            - sources
            - title
            - wow
            - years
            - zoom
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
