# Isolated Sankofa builder; no registry is needed for node binaries.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sankofa-build
  namespace: tenant-sankofa
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: replicated
  resources:
    requests:
      storage: 60Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: sankofa-builder
  namespace: tenant-sankofa
  labels:
    app: sankofa-builder
spec:
  terminationGracePeriodSeconds: 5
  containers:
  - name: tools
    image: golang:1.26-bookworm
    command: [sh, -c, "mkdir -p /work/tmp && exec sleep infinity"]
    workingDir: /work
    env:
    # Compilers' temporaries go to the volume: the container's own disk is
    # small, and filling it evicts the whole pod.
    - {name: TMPDIR, value: /work/tmp}
    - {name: GOPATH, value: /work/go}
    - {name: GOCACHE, value: /work/gocache}
    - {name: GOFLAGS, value: -mod=readonly}
    - {name: GOMAXPROCS, value: "4"}
    - {name: JOBS, value: "4"}
    resources:
      requests: {cpu: 80m, memory: 1Gi}
      limits: {cpu: "4", memory: 8Gi}
    volumeMounts:
    - {name: work, mountPath: /work}
  - name: alpine
    image: alpine:3.22
    command: [sh, -c, "mkdir -p /work/tmp && exec sleep infinity"]
    env:
    - {name: TMPDIR, value: /work/tmp}
    resources:
      requests: {cpu: 10m, memory: 128Mi}
      limits: {cpu: "1", memory: 1Gi}
    volumeMounts:
    - {name: work, mountPath: /work}
  - name: files
    image: busybox:stable
    command: [sh, -c, "mkdir -p /work/out && exec httpd -f -p 8080 -h /work/out"]
    ports:
    - containerPort: 8080
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 500m, memory: 128Mi}
    volumeMounts:
    - {name: work, mountPath: /work}
  volumes:
  - name: work
    persistentVolumeClaim:
      claimName: sankofa-build
---
apiVersion: v1
kind: Service
metadata:
  name: sankofa-builder
  namespace: tenant-sankofa
spec:
  selector:
    app: sankofa-builder
  ports:
  - {name: files, port: 8080}
