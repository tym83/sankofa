server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /data/ {
        add_header Cache-Control "no-cache";
    }
    # The live heartbeat of the cluster, from Griot, for the listening room.
    location = /pulse {
        proxy_pass http://griot.sankofa-system.svc.cluster.local:8081/pulse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        resolver kube-dns.kube-system.svc.cluster.local valid=30s;
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
